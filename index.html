  <body>
    <!--
      THESIS: It should feel like it came out of the Pokémon world. Rotom is the real Rotom
      Dex from Sun and Moon and it is the interface: data on its own screen, its words in a
      game text box, nothing in side panels. Refuses the dark-neon card grid most Pokédex
      sites ship.
      OWN-WORLD: An anime title-card sky in saturated blue with a flat "mood sun" behind Rotom
      (amber idle, cyan scanning, green success, red error), burst wedges and halftone dots.
      On Rotom's screen, the games' touch-screen menus: white paper, cyan title bar, yellow
      cursor. A cream text box in a gold rim. White pill keys in a glass tray. M PLUS
      Rounded 1c throughout.
      STORY: Wake Rotom; ask for anything; watch it scan, cheer or sulk; read its screen, hear
      its report.
      FIRST VIEWPORT: Night. Rotom asleep and centred, one yellow power key beneath it. Awake:
      day, text box and keys; the camera comes in when there is something to read. On a phone
      the phone itself is Rotom: red body, eyes at the top, its face on the display.
      FORM: Brief-pinned (the canonical Rotom Dex, cel-shaded 3D, glass key tray, blue and
      yellow accents); no concept roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
